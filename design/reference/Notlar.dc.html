<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kararlar ve açık sorular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 960px; min-height: 3400px; box-sizing: border-box; padding: 72px 64px 96px; background: #F3F5FC; color: #0B1026; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; gap: 48px">
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="font-family: 'Oxanium', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.3em; color: #1F7A4D">TASARIM NOTU</div>
    <div style="font-family: 'Oxanium', sans-serif; font-size: 52px; font-weight: 800; line-height: 1.05">Kararlar, nedenleri ve açık sorular</div>
    <div style="font-size: 18px; line-height: 1.55; color: #3A4470">Ekteki oyun.html bana ulaşmadı; kurallar ve görsel dil brief'teki tariften kuruldu. Dosya gelince tasarım ondaki ayrıntılarla karşılaştırılmalı.</div>
  </div>

  <sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="font-family: 'Oxanium', sans-serif; font-size: 30px; font-weight: 800">{{s.title}}</div>
      <sc-for list="{{s.items}}" as="i" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; padding: 18px 20px; border-radius: 16px; background: #FFFFFF; border: 1px solid #D9DEEF">
          <div style="width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Oxanium', sans-serif; font-size: 15px; font-weight: 800; {{s.badge}}">{{i.n}}</div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="font-size: 18px; font-weight: 700; line-height: 1.35">{{i.t}}</div>
            <div style="font-size: 16px; line-height: 1.55; color: #3A4470">{{i.d}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":3400}}'>
class Component extends DCLogic {
  renderVals() {
    var num = function (arr) { return arr.map(function (x, i) { return { n: String(i + 1), t: x[0], d: x[1] }; }); };
    var sections = [
      { title: 'Önemli kararlar', badge: 'background: #0B1026; color: #3BFF8F', items: num([
        ['Mod göstergesi tahtanın hemen üstünde, iki zıt yüzeyle', 'DÜZ açık buz zemin + kare ikon + "+"; ÇAPRAZ koyu zemin + elmas + "×" deseni. Renge bakmadan, gözün ucuyla bile ayrılır. Tahta çerçevesinin dokusu da + ya da × ızgaraya döner; yıldızın şekli üçüncü kanıt olur.'],
        ['Şekil = yürüme, iç işaret = vurma', 'Brief\'teki dil korundu ve tek kurala bağlandı: dış şekil (kare/elmas) yürüme yönü, ortadaki kılıç (+/×) vurma yönü. Yıldızda vurma yönü yürümeyle aynı olduğu için iç alan amblemi taşır.'],
        ['Oyuncular renk + amblemle ayrılır', 'Neon/daire, Güneş/üçgen, Fuşya/çift çizgi, Lavanta/halka. Amblemler kare ve elmasın içine sığacak biçimde çizildi; 26 pt\'de de seçilir. Renk körü modu paleti parlaklıkça açar ve amblem çizgisini kalınlaştırır.'],
        ['Botlar bilerek soluk', 'Tip bilgisini şekil ve kılıç verdiği için bot renkleri kiremit ve çelik tonlarına çekildi. Böylece tehlike kırmızısı, halka turuncusu ve oyuncu renkleri ile yarışmazlar.'],
        ['Sekizgen kare korundu, köşe kesiği tahtaya göre küçülür', '9×9\'da %26, 11×11\'de %22, 13×13\'te %18. 26 pt\'de iç alan büyük kalır, taş sığar; kareler arası çentikler ızgarayı okutur. Gerekirse yedek: köşesi 3 pt yuvarlatılmış kare (aynı token\'larla).'],
        ['Geniş dokunma alanı ile 13×13 sorunu çözülür', 'Sırada en fazla 4 kareye gidilebildiği için dokunuş, en yakın yanan kareye çekilir (yarıçap ≈ 1,6 kare). Pratikte her hedef 44 pt\'den büyük davranır. Kendi taşına dokunmak tehditleri gösterir; bir bota dokunmak bilgi kartını açar. Yakınlaştırma yine önerilir: iki parmak ya da çift dokunuşla taşın etrafında 1,6×.'],
        ['Önizleme riski sayar, kararı oyuncuya bırakır', 'Seçilen karede bu tur seni vurabilecek taşlar kırmızı kesik çizgiyle bağlanır, panelde listelenir. Riskli hamlede Onayla butonu kırmızıya döner ve "Riskli · Onayla" der; engellemez.'],
        ['Başparmak bölgesi', 'Tüm kararlar (Onayla, Vazgeç, Hızlandır, İzlemeye devam) alttaki panelde. Onayla sağda ve iki kat geniş. Üstte yalnız bilgi var; menü ve kayıt köşede ikincil.'],
        ['Bot sırası zamanda gösterilir', 'Oyuncu turunda tahtada numara yok. Bot turunda yalnız oynayan bot ve sıradaki 3 bot rozet alır. Ayrıca uzun basınca kartta ve önizleme listesinde görünür.']
      ]) },
      { title: 'Varsayımlar', badge: 'background: #E9F0FF; color: #0B1026', items: num([
        ['Halka takvimi', 'İlk çöküş 9×9\'da tur 11\'in sonunda, sonra her 4 turda bir. 11×11 ve 13×13\'te ilk çöküş tur 12–13, aynı aralıkla. Uyarı, çökecek turun başında görünür; çöküş botlardan sonra, mod değişmeden önce olur. 5–10 dakika hedefiyle test edilmeli.'],
        ['Tehdit hesabı', 'Önizleme, seçilen karede bu turun geri kalanında hamle yapacak her taşı sayar (sırası henüz gelmemiş oyuncular ve tüm botlar).'],
        ['Kopan oyuncu', 'Sırası gelmişse oyun en fazla 30 sn bekler, sonra İkiz oynar. Sırası değilse oyun durmaz; 30 sn içinde dönmezse sırası geldiğinde İkiz oynar.'],
        ['Hamle süresi seçenekleri', 'Lobide 10 / 20 / 30 sn. Varsayılan 20.'],
        ['Başlangıç noktaları', '9×9: (2,5) ve (8,5); 11×11: üçgen dizilim; 13×13: dört kenarın ortası, birer kare içeride. Lobideki önizleme bunu gösterir.'],
        ['Prototip', 'Prototip 9×9, 2 yıldızla bir tam tur oynar (önizleme, onay, rakip, bot turu, mod değişimi). Bot zekâsı basit bir yer tutucudur; kurallar gerçek. Tur 8\'den sonra "oyun sonuna geç" kısayolu çıkar.']
      ]) },
      { title: 'Kuralın tasarımı zorladığı yerler', badge: 'background: #FFE2C8; color: #0B1026', items: num([
        ['Bot turu 1–1,5 sn ve 28 bot', 'Bot başına ≈ 45 ms düşüyor; tek tek izlemek mümkün değil. Öneri: kaymalar üst üste binsin (her biri 130 ms), sırayı rozetler ve çizgi izleri anlatsın. Seni vuran bot gelirse tur bir an (250 ms) yavaşlasın.'],
        ['Mod her turda değişir ama ilk oyuncu da değişir', 'Kim başladığı karışabilir. Mod kartı ve panel turun ilk oyuncusunu yazar ("Tur 8 · ilk sıra Oyuncu 2").'],
        ['İkiz hem bot hem oyuncu', 'İkiz oyuncu şeridinde koltuğun rengi ve amblemiyle durur, adı "İkiz" olur. Bot değil yıldızdır; botlar onu da kovalar.']
      ]) },
      { title: 'Açık sorular', badge: 'background: #FFD0D8; color: #0B1026', items: num([
        ['Bot sayısı ve halka aralığı nasıl ayarlanacak?', 'Önerim: ilk testlerde maç süresi ve "ilk elenme turu" ölçülsün; hedef ilk elenme tur 6–9 arası.'],
        ['Yıldız yıldızı vurduğunda vuruş sayısı nasıl gösterilsin?', 'Şu an bot ve yıldız vuruşu aynı sayılıyor. Oyun sonunda ikisi ayrı istatistik olabilir.'],
        ['Sol el modu gerekli mi?', 'Onayla butonu sağda. Sol elle oynayanlar için ayna düzen bir ayar olabilir; brief\'te yok, eklemedim.'],
        ['Paylaşılan sonuç kartı', 'Paylaş butonu bir görsel kart mı (tahta + sıralama) yoksa yalnız davet linki mi üretmeli?'],
        ['Ses dili', 'Vuruş, mod değişimi ve halka için ses karakteri (mekanik / elektronik) seçilmeli.'],
        ['İsim', 'Sekiz, Düz Çapraz, Yıldız Meydanı. Seçilen isim logo yönünü değiştirmez.']
      ]) }
    ];
    return { sections: sections };
  }
}
</script>
</body>
</html>
