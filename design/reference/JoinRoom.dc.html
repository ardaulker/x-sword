<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 47px 0 34px; background: radial-gradient(120% 50% at 50% 0%, #141E48 0%, #0B1026 62%); color: #EEF2FF; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
  <div style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 10px">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EEF2FF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"></path></svg>
    </a>
    <span style="font-size: 20px; font-weight: 700">Join room</span>
  </div>

  <div style="margin: 0 16px; display: flex; flex-direction: column; gap: 10px">
    <label for="code" style="font-size: 14px; font-weight: 700; color: #A9B4DA">Room code</label>
    <div style="position: relative; height: 72px">
      <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; pointer-events: none">
        <sc-for list="{{boxes}}" as="b" hint-placeholder-count="5">
          <div style="border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'Oxanium', sans-serif; font-size: 32px; font-weight: 700; {{b.st}}">{{b.ch}}</div>
        </sc-for>
      </div>
      <input id="code" value="{{code}}" onChange="{{onCode}}" maxlength="5" autocomplete="off" autocapitalize="characters" inputmode="text" aria-describedby="codeHint" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0">
    </div>
    <div id="codeHint" style="font-size: 13px; font-weight: 500; color: {{hintCol}}">{{hint}}</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" onClick="{{paste}}" style="height: 48px; border-radius: 12px; border: 1.5px solid #3A4785; background: transparent; color: #EEF2FF; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px 'Barlow', sans-serif">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 H15 V7 H9 Z M7 5.5 H5 V21 H19 V5.5 H17"></path></svg>
        <span>Paste</span>
      </button>
      <button type="button" style="height: 48px; border-radius: 12px; border: 1.5px solid #3A4785; background: transparent; color: #EEF2FF; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px 'Barlow', sans-serif">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8 V4 H8 M16 4 H20 V8 M20 16 V20 H16 M8 20 H4 V16 M4 12 H20"></path></svg>
        <span>QR tara</span>
      </button>
    </div>
  </div>

  <div style="margin: 0 16px; padding: 16px; border-radius: 18px; background: #121A3A; border: 1px solid #26306A; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="ad" style="font-size: 14px; font-weight: 700; color: #A9B4DA">Takma ad</label>
      <input id="ad" value="{{name}}" onChange="{{onName}}" maxlength="12" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #3A4785; background: #0B1026; color: #EEF2FF; font: 600 18px 'Barlow', sans-serif">
      <span style="font-size: 12px; font-weight: 500; color: #8591BE">No account needed. The name is kept on this device.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 700; color: #A9B4DA">Color and emblem</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{colors}}" as="c" hint-placeholder-count="4">
          <button type="button" aria-label="{{c.label}}" onClick="{{c.pick}}" style="height: 64px; border-radius: 14px; background: #0B1026; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; {{c.st}}">
            <span style="position: relative; width: 30px; height: 30px">
              <span style="position: absolute; left: 17%; top: 17%; width: 66%; height: 66%; border-radius: 10%; box-shadow: 0 0 0 2px #FFFFFF; background: {{c.col}}"></span>
              <svg viewBox="0 0 100 100" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{c.d}}" fill="{{c.f}}" stroke="{{c.s}}" stroke-width="{{c.w}}" stroke-linecap="round"></path></svg>
            </span>
            <span style="font-size: 11px; font-weight: 600; color: #A9B4DA">{{c.taken}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="margin: auto 16px 0">
    <a href="{{joinHref}}" style="height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; text-decoration: none; {{joinSt}}">{{joinTxt}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this, s = this.state || {};
    var code = s.code === undefined ? 'K7Q' : s.code, name = s.name === undefined ? 'Player 2' : s.name, col = s.col === undefined ? 1 : s.col;
    var INK = '#0B1026', PC = ['#3BFF8F', '#FFC53D', '#FF5CC0', '#B392FF'], PN = ['Neon · dot', 'Sun · triangle', 'Fuchsia · bar', 'Lavender · ring'];
    var EMB = [
      { d: 'M50 36 A14 14 0 1 1 49.99 36 Z', f: INK, s: 'none', w: 0 },
      { d: 'M50 33 L66 62 L34 62 Z', f: INK, s: INK, w: 3 },
      { d: 'M33 42 H67 M33 58 H67', f: 'none', s: INK, w: 9 },
      { d: 'M50 37 A13 13 0 1 1 49.99 37 Z', f: 'none', s: INK, w: 8 }
    ];
    var up = code.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    var boxes = [];
    for (var i = 0; i < 5; i++) {
      var ch = up[i] || '', active = i === up.length;
      boxes.push({ ch: ch, st: 'background: #121A3A; border: 2px solid ' + (active ? '#E9F0FF' : (ch ? '#3A4785' : '#26306A')) });
    }
    var ok = up.length === 5 && name.trim().length > 0;
    var colors = PC.map(function (c, i) {
      var taken = i === 0;
      return { col: c, d: EMB[i].d, f: EMB[i].f, s: EMB[i].s, w: EMB[i].w, label: PN[i] + (taken ? ' (taken)' : ''), taken: taken ? 'Taken' : (i === col ? 'Selected' : PN[i].split(' · ')[1]),
        st: (i === col ? 'border: 2px solid ' + c : 'border: 1.5px solid #26306A') + (taken ? '; opacity: .4; pointer-events: none' : ''),
        pick: function () { if (!taken) self.setState({ col: i }); } };
    });
    return {
      code: up, name: name, boxes: boxes, colors: colors,
      hint: up.length === 5 ? 'Room found: Player 1\'s room · 2/4 people' : 'Code: 5 characters, letters and digits',
      hintCol: up.length === 5 ? '#3BFF8F' : '#A9B4DA',
      onCode: function (e) { self.setState({ code: e.target.value }); },
      onName: function (e) { self.setState({ name: e.target.value }); },
      paste: function () { self.setState({ code: 'K7Q2M' }); },
      joinHref: ok ? 'LobbyGuest.dc.html' : '#',
      joinSt: ok ? 'background: #3BFF8F; color: #0B1026' : 'background: #232D5E; color: #A9B4DA',
      joinTxt: ok ? 'Join room' : 'Complete the code'
    };
  }
}
</script>
</body>
</html>
