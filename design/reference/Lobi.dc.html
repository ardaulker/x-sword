<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Lobi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 47px 0 34px; background: radial-gradient(120% 50% at 50% 0%, #141E48 0%, #0B1026 62%); color: #EEF2FF; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; gap: 10px">

  <div style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 10px; flex: none">
    <a href="Main.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #EEF2FF">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.15">
      <span style="font-size: 20px; font-weight: 700">Lobi</span>
      <span style="font-size: 13px; font-weight: 500; color: #A9B4DA">{{roleTxt}}</span>
    </div>
    <button type="button" aria-label="Oda kodunu kopyala" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px dashed #3A4785; background: #121A3A; color: #EEF2FF; display: flex; align-items: center; gap: 8px">
      <span style="font-family: 'Oxanium', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.16em">K7Q2M</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9B4DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9 H19 V19 H9 Z M5 15 V5 H15"></path></svg>
    </button>
  </div>

  <div style="margin: 0 12px; display: flex; flex-direction: column; gap: 8px; flex: none">
    <button type="button" style="height: 52px; border-radius: 14px; border: 0; background: #E9F0FF; color: #0B1026; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 16px 'Barlow', sans-serif">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1026" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 L5.3 16.2 A8 8 0 1 1 8 18.8 Z M9 9.5 C9 12.5 11.5 15 14.5 15"></path></svg>
      <span>WhatsApp ile davet et</span>
    </button>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid #3A4785; background: transparent; color: #EEF2FF; display: flex; align-items: center; justify-content: center; gap: 6px; font: 600 14px 'Barlow', sans-serif">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14 A4 4 0 0 0 15.7 14 L19 10.7 A4 4 0 0 0 13.3 5 L12 6.3 M14 10 A4 4 0 0 0 8.3 10 L5 13.3 A4 4 0 0 0 10.7 19 L12 17.7"></path></svg>
        <span>Link</span>
      </button>
      <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid #3A4785; background: transparent; color: #EEF2FF; display: flex; align-items: center; justify-content: center; gap: 6px; font: 600 14px 'Barlow', sans-serif">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4 H10 V10 H4 Z M14 4 H20 V10 H14 Z M4 14 H10 V20 H4 Z M14 14 H16 V16 H14 Z M18 18 H20 V20 H18 Z M18 14 H20 M14 18 V20"></path></svg>
        <span>QR kod</span>
      </button>
      <button type="button" style="height: 44px; border-radius: 12px; border: 1.5px solid #3A4785; background: transparent; color: #EEF2FF; display: flex; align-items: center; justify-content: center; gap: 6px; font: 600 14px 'Barlow', sans-serif">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 V15 M7 9 L12 4 L17 9 M5 14 V20 H19 V14"></path></svg>
        <span>Paylaş</span>
      </button>
    </div>
  </div>

  <div style="margin: 0 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; flex: none">
    <sc-for list="{{seats}}" as="s" hint-placeholder-count="4">
      <div style="height: 108px; box-sizing: border-box; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; {{s.box}}">
        <sc-if value="{{s.filled}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 10px">
            <div style="position: relative; width: 34px; height: 34px; flex: none">
              <div style="position: absolute; left: 17%; top: 17%; width: 66%; height: 66%; border-radius: 10%; box-shadow: 0 0 0 2px #FFFFFF; background: {{s.col}}"></div>
              <svg viewBox="0 0 100 100" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{s.emb.d}}" fill="{{s.emb.f}}" stroke="{{s.emb.s}}" stroke-width="{{s.emb.w}}" stroke-linecap="round"></path></svg>
            </div>
            <div style="min-width: 0; display: flex; flex-direction: column; line-height: 1.2">
              <span style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
              <span style="font-size: 12px; font-weight: 600; color: #A9B4DA">{{s.tag}}</span>
            </div>
          </div>
          <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px">
            <span style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; font-size: 13px; font-weight: 700; {{s.readySt}}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.readyIcon}}"></path></svg>
              <span>{{s.readyTxt}}</span>
            </span>
            <sc-if value="{{s.canRemove}}" hint-placeholder-val="{{ false }}">
              <button type="button" aria-label="Koltuğu boşalt" onClick="{{s.remove}}" style="width: 44px; height: 44px; margin: -8px -6px -8px 0; border-radius: 22px; border: 0; background: transparent; color: #A9B4DA; display: flex; align-items: center; justify-content: center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"></path></svg>
              </button>
            </sc-if>
          </div>
        </sc-if>
        <sc-if value="{{s.empty}}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 14px; font-weight: 600; color: #A9B4DA">{{s.emptyTxt}}</div>
          <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
            <button type="button" onClick="{{s.invite}}" style="height: 52px; border-radius: 10px; border: 0; background: #1A2452; color: #EEF2FF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 11px 'Barlow', sans-serif">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11 A4 4 0 1 0 9.01 11 Z M2 21 C2 17 5 15 9 15 C11 15 12.5 15.5 13.5 16.3 M19 8 V14 M16 11 H22"></path></svg>
              <span>Davet et</span>
            </button>
            <button type="button" onClick="{{s.ikiz}}" style="height: 52px; border-radius: 10px; border: 0; color: #EEF2FF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 11px 'Barlow', sans-serif; {{s.hostBtn}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8 H18 V18 H6 Z M12 4 V8 M9.5 12.5 V13 M14.5 12.5 V13 M3 12 V14 M21 12 V14"></path></svg>
              <span>İkiz ekle</span>
            </button>
            <button type="button" onClick="{{s.close}}" style="height: 52px; border-radius: 10px; border: 0; color: #EEF2FF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 11px 'Barlow', sans-serif; {{s.hostBtn}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11 H18 V20 H6 Z M8.5 11 V8 A3.5 3.5 0 0 1 15.5 8 V11"></path></svg>
              <span>Kapat</span>
            </button>
          </div>
        </sc-if>
        <sc-if value="{{s.closed}}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 14px; font-weight: 600; color: #8591BE">Kapalı koltuk</div>
          <button type="button" onClick="{{s.remove}}" style="margin-top: auto; height: 44px; border-radius: 10px; border: 1.5px dashed #3A4785; background: transparent; color: #A9B4DA; font: 600 13px 'Barlow', sans-serif">Koltuğu aç</button>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="margin: 0 12px; padding: 12px; border-radius: 16px; background: #121A3A; border: 1px solid #26306A; display: flex; flex-direction: column; gap: 12px; flex: none">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #A9B4DA"><span>Bot zorluğu</span><span style="font-weight: 500">{{diffHint}}</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 12px; background: #0B1026">
        <sc-for list="{{diffs}}" as="o" hint-placeholder-count="3">
          <button type="button" onClick="{{o.pick}}" style="height: 40px; border-radius: 9px; border: 0; font: 700 14px 'Barlow', sans-serif; {{o.st}}">{{o.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: #A9B4DA"><span>Hamle süresi</span><span style="font-weight: 500">Süre biterse güvenli hamle yapılır</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 12px; background: #0B1026">
        <sc-for list="{{times}}" as="o" hint-placeholder-count="3">
          <button type="button" onClick="{{o.pick}}" style="height: 40px; border-radius: 9px; border: 0; font: 700 14px 'Barlow', sans-serif; {{o.st}}">{{o.label}}</button>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="margin: 0 12px; display: flex; align-items: center; gap: 14px; flex: none">
    <div style="display: grid; gap: 1px; padding: 4px; border-radius: 8px; background: #0D1431; box-shadow: inset 0 0 0 1px rgba(233,240,255,.2); {{mini.gridSt}}">
      <sc-for list="{{mini.cells}}" as="c" hint-placeholder-count="81">
        <div style="border-radius: 1px; {{c.st}}"></div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <span style="font-family: 'Oxanium', sans-serif; font-size: 22px; font-weight: 800">{{mini.title}}</span>
      <span style="font-size: 13px; font-weight: 600; color: #A9B4DA">{{mini.sub}}</span>
      <span style="font-size: 12px; font-weight: 500; color: #8591BE">Renkli noktalar: başlangıç kareleri</span>
    </div>
  </div>

  <div style="margin: auto 12px 0; flex: none">
    <sc-if value="{{host}}" hint-placeholder-val="{{ true }}">
      <a href="{{startHref}}" style="height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 700; text-decoration: none; {{startSt}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5 L19 12 L7 19.5 Z"></path></svg>
        <span>{{startTxt}}</span>
      </a>
    </sc-if>
    <sc-if value="{{guest}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <button type="button" onClick="{{toggleReady}}" style="height: 60px; border-radius: 16px; border: 0; font: 700 18px 'Barlow', sans-serif; {{readyBtnSt}}">{{readyBtnTxt}}</button>
        <span style="text-align: center; font-size: 13px; font-weight: 500; color: #A9B4DA">Maçı odayı kuran Oyuncu 1 başlatır</span>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kurucu":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  host() { var v = this.props.kurucu; return !(v === false || v === '0' || v === 'false' || v === 0); }
  st() {
    var s = this.state || {};
    return {
      seats: s.seats || ['me', 'p', 'empty', 'empty'],
      diff: s.diff === undefined ? 1 : s.diff,
      time: s.time === undefined ? 1 : s.time,
      ready: s.ready === undefined ? false : s.ready,
      inv: s.inv || {}
    };
  }
  renderVals() {
    var self = this, host = this.host(), S = this.st();
    var INK = '#0B1026';
    var PC = ['#3BFF8F', '#FFC53D', '#FF5CC0', '#B392FF'];
    var EMB = [
      { d: 'M50 36 A14 14 0 1 1 49.99 36 Z', f: INK, s: 'none', w: 0 },
      { d: 'M50 33 L66 62 L34 62 Z', f: INK, s: INK, w: 3 },
      { d: 'M33 42 H67 M33 58 H67', f: 'none', s: INK, w: 9 },
      { d: 'M50 37 A13 13 0 1 1 49.99 37 Z', f: 'none', s: INK, w: 8 }
    ];
    var set = function (i, v) { var a = S.seats.slice(); a[i] = v; var inv = Object.assign({}, S.inv); delete inv[i]; self.setState({ seats: a, inv: inv }); };
    var stars = 0;
    var seats = S.seats.map(function (t, i) {
      var filled = t === 'me' || t === 'p' || t === 'ikiz';
      if (filled) stars++;
      var name = '', tag = '', ready = false;
      if (t === 'me') { name = host ? 'Oyuncu 1 (sen)' : 'Oyuncu 1'; tag = 'Kurucu'; ready = true; }
      if (t === 'p') { name = host ? 'Oyuncu 2' : 'Oyuncu 2 (sen)'; tag = 'Oyuncu'; ready = host ? true : S.ready; }
      if (t === 'ikiz') { name = 'İkiz'; tag = 'Bot yıldız · sırasını oynar'; ready = true; }
      var invited = !!S.inv[i];
      return {
        filled: filled, empty: t === 'empty', closed: t === 'closed',
        box: filled ? 'background: #121A3A; border: 1.5px solid ' + PC[i] + '66' : (t === 'closed' ? 'background: transparent; border: 1.5px dashed #26306A' : 'background: #0E1534; border: 1.5px dashed #3A4785'),
        col: PC[i], emb: EMB[i], name: name, tag: tag,
        readySt: ready ? 'background: rgba(59,255,143,.14); color: #3BFF8F' : 'background: #232D5E; color: #A9B4DA',
        readyIcon: ready ? 'M5 12.5 L10 17 L19 7' : 'M12 6 V12 L15 14',
        readyTxt: ready ? 'Hazır' : 'Bekleniyor',
        canRemove: host && t === 'ikiz',
        emptyTxt: invited ? 'Davet gönderildi…' : 'Boş koltuk',
        hostBtn: host ? 'background: #1A2452' : 'background: #1A2452; opacity: .35; pointer-events: none',
        invite: function () { var inv = Object.assign({}, S.inv); inv[i] = 1; self.setState({ inv: inv }); },
        ikiz: function () { if (host) set(i, 'ikiz'); },
        close: function () { if (host) set(i, 'closed'); },
        remove: function () { if (host) set(i, 'empty'); }
      };
    });
    var segSt = function (on) { return on ? 'background: #E9F0FF; color: #0B1026' : 'background: transparent; color: #A9B4DA'; };
    var DL = ['Kolay', 'Normal', 'Zor'], DH = ['Botlar kovalar, hata yapar', 'Yenilecek kareye gitmez', 'Bir sonraki tura vuruş hazırlar'];
    var diffs = DL.map(function (l, i) { return { label: l, st: segSt(S.diff === i) + (host ? '' : '; pointer-events: none'), pick: function () { if (host) self.setState({ diff: i }); } }; });
    var TL = ['10 sn', '20 sn', '30 sn'];
    var times = TL.map(function (l, i) { return { label: l, st: segSt(S.time === i) + (host ? '' : '; pointer-events: none'), pick: function () { if (host) self.setState({ time: i }); } }; });

    var n = stars <= 2 ? 9 : stars === 3 ? 11 : 13;
    var bots = n === 9 ? 14 : n === 11 ? 21 : 28;
    var starts = n === 9 ? [[1, 4], [7, 4]] : n === 11 ? [[1, 5], [8, 1], [8, 9]] : [[1, 6], [6, 11], [11, 6], [6, 1]];
    var filledIdx = []; S.seats.forEach(function (t, i) { if (t === 'me' || t === 'p' || t === 'ikiz') filledIdx.push(i); });
    var cs = Math.floor(96 / n), cells = [];
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      var k = -1; starts.forEach(function (p, j) { if (p[0] === r && p[1] === c) k = j; });
      var bg = k >= 0 && filledIdx[k] !== undefined ? PC[filledIdx[k]] : (((r + c) % 2) ? '#1D2858' : '#1A2452');
      cells.push({ st: 'width:' + cs + 'px;height:' + cs + 'px;background:' + bg });
    }
    var can = stars >= 2;
    return {
      roleTxt: host ? 'Odayı sen kurdun' : 'Oyuncu 1\'in odası',
      seats: seats, diffs: diffs, times: times, diffHint: DH[S.diff],
      mini: { gridSt: 'grid-template-columns: repeat(' + n + ', ' + cs + 'px)', cells: cells, title: n + '×' + n + ' · ' + stars + ' yıldız', sub: '~' + bots + ' bot · 5–10 dk' },
      host: host, guest: !host,
      startHref: can ? 'Prototip.dc.html' : '#',
      startSt: can ? 'background: #3BFF8F; color: #0B1026; box-shadow: 0 10px 30px rgba(59,255,143,.25)' : 'background: #232D5E; color: #A9B4DA',
      startTxt: can ? 'Başlat' : 'En az 2 yıldız gerekli',
      toggleReady: function () { self.setState({ ready: !S.ready }); },
      readyBtnSt: S.ready ? 'background: rgba(59,255,143,.16); color: #3BFF8F; box-shadow: inset 0 0 0 2px #3BFF8F' : 'background: #FFC53D; color: #0B1026',
      readyBtnTxt: S.ready ? 'Hazırsın · geri al' : 'Hazırım'
    };
  }
}
</script>
</body>
</html>
