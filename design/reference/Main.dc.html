</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var deco = [];
    for (var r = 0; r < 7; r++) {
      for (var c = 0; c < 9; c++) {
        var dx = (c - 4) / 4.5, dy = (r - 2.6) / 3.2;
        var o = Math.max(0, 0.55 - Math.sqrt(dx * dx + dy * dy) * 0.5);
        deco.push({ o: o.toFixed(2) });
      }
    }
    return { deco: deco };
  }
}
</script>
