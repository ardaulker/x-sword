<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Oyun sonu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 47px 0 34px; background: radial-gradient(110% 45% at 50% 12%, #1B3A3A 0%, #0B1026 65%); color: #EEF2FF; font-family: 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px">
  <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 20px">
    <span style="font-family: 'Oxanium', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: #A9B4DA">MAÇ BİTTİ · 11×11 · 14 TUR · 8:12</span>
    <a href="Main.dc.html" aria-label="Ana menü" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A9B4DA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"></path></svg>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 0 6px">
    <div style="position: relative; width: 120px; height: 120px">
      <svg viewBox="0 0 200 200" style="position: absolute; inset: -20px; width: 160px; height: 160px; overflow: visible" aria-hidden="true">
        <rect x="44" y="44" width="112" height="112" rx="6" fill="none" stroke="rgba(233,240,255,.35)" stroke-width="3"></rect>
        <polygon points="100,21 179,100 100,179 21,100" fill="none" stroke="rgba(59,255,143,.5)" stroke-width="3"></polygon>
      </svg>
      <div style="position: absolute; left: 20%; top: 20%; width: 60%; height: 60%; border-radius: 10%; background: #3BFF8F; box-shadow: 0 0 0 4px #FFFFFF, 0 0 50px #3BFF8FAA"></div>
      <svg viewBox="0 0 100 100" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="M50 38 A12 12 0 1 1 49.99 38 Z" fill="#0B1026"></path></svg>
    </div>
    <div style="font-family: 'Oxanium', sans-serif; font-size: 34px; font-weight: 800; color: #3BFF8F; line-height: 1">Kazandın!</div>
    <div style="font-size: 15px; font-weight: 500; color: #A9B4DA">Son kalan yıldız sensin</div>
  </div>

  <div style="margin: 0 12px; display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 14px; border-radius: 14px; background: #121A3A; {{r.box}}">
        <span style="width: 22px; font-family: 'Oxanium', sans-serif; font-size: 22px; font-weight: 800; color: {{r.col}}">{{r.place}}</span>
        <span style="position: relative; width: 30px; height: 30px; flex: none">
          <span style="position: absolute; left: 17%; top: 17%; width: 66%; height: 66%; border-radius: 10%; box-shadow: 0 0 0 2px #FFFFFF; {{r.shape}}"></span>
          <svg viewBox="0 0 100 100" style="position: absolute; inset: 0; width: 100%; height: 100%"><path d="{{r.d}}" fill="{{r.f}}" stroke="{{r.s}}" stroke-width="{{r.w}}" stroke-linecap="round"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2">
          <span style="font-size: 16px; font-weight: 700">{{r.name}}</span>
          <span style="font-size: 12px; font-weight: 500; color: #A9B4DA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.note}}</span>
        </span>
        <span style="display: flex; align-items: center; gap: 4px; font-family: 'Oxanium', sans-serif; font-size: 18px; font-weight: 700">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9B4DA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 L9.5 14.5 M20 4 V9 M20 4 H15 M6 13 L11 18 M4 20 L8.2 15.8"></path></svg>
          {{r.kills}}
        </span>
      </div>
    </sc-for>
  </div>

  <div style="margin: 0 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
      <div style="padding: 12px 10px; border-radius: 14px; background: #121A3A; border: 1px solid #26306A; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Oxanium', sans-serif; font-size: 26px; font-weight: 800; line-height: 1">{{s.v}}</span>
        <span style="font-size: 12px; font-weight: 600; color: #A9B4DA; line-height: 1.25">{{s.l}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin: auto 12px 0; display: flex; flex-direction: column; gap: 8px">
    <a href="Lobi.dc.html" style="height: 60px; border-radius: 16px; background: #3BFF8F; color: #0B1026; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1026" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 A8 8 0 0 1 18 6.5 M18 3 V7 H14 M20 12 A8 8 0 0 1 6 17.5 M6 21 V17 H10"></path></svg>
      <span style="font-size: 18px; font-weight: 700; color: #0B1026">Rövanş</span>
      <span style="height: 24px; padding: 0 8px; border-radius: 12px; background: rgba(11,16,38,.15); display: flex; align-items: center; font-size: 13px; font-weight: 700; color: #0B1026">Oyuncu 2 hazır · 1/3</span>
    </a>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 52px; border-radius: 14px; border: 1.5px solid #3A4785; background: transparent; color: #EEF2FF; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 16px 'Barlow', sans-serif">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 V15 M7 9 L12 4 L17 9 M5 14 V20 H19 V14"></path></svg>
        <span>Paylaş</span>
      </button>
      <a href="Main.dc.html" style="height: 52px; border-radius: 14px; border: 1.5px solid #3A4785; color: #EEF2FF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Ana menü</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var INK = '#0B1026';
    var rows = [
      { place: '1', name: 'Oyuncu 1 (sen)', note: 'Son kalan yıldız', kills: '4', col: '#3BFF8F', shape: 'background:#3BFF8F', d: 'M50 36 A14 14 0 1 1 49.99 36 Z', f: INK, s: 'none', w: 0, box: 'border: 1.5px solid #3BFF8F' },
      { place: '2', name: 'Oyuncu 2', note: 'Tur 14 · Kızıl #3 vurdu', kills: '3', col: '#EEF2FF', shape: 'background:#FFC53D', d: 'M50 33 L66 62 L34 62 Z', f: INK, s: INK, w: 3, box: 'border: 1px solid #26306A' },
      { place: '3', name: 'Oyuncu 3', note: 'Tur 11 · Çelik #18 vurdu', kills: '1', col: '#EEF2FF', shape: 'background:#FF5CC0', d: 'M33 42 H67 M33 58 H67', f: 'none', s: INK, w: 9, box: 'border: 1px solid #26306A' }
    ];
    var stats = [
      { v: '14', l: 'tur hayatta kaldın' },
      { v: '2', l: 'riskli hamleden sağ çıktın' },
      { v: '0', l: 'kez süren doldu' }
    ];
    return { rows: rows, stats: stats };
  }
}
</script>
</body>
</html>
