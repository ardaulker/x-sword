# Publishes the site to GitHub Pages on every push to main.
# Root pages (index.html, arena/, engine/ ...) are copied as they are; app/ is built and served under /play/.
# The old address /oyun/ (before the English rename) redirects to /play/ and keeps the #/ route.
# Requires: Settings → Pages → Source: "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Engine tests
        run: node tests/engine.test.mjs

      - name: Build the game (type check + Vite)
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Assemble the site
        run: |
          mkdir _site
          git ls-files -z | grep -zv -e '^app/' -e '^\.' | xargs -0 cp --parents -t _site
          cp -r app/dist _site/play
          mkdir -p _site/oyun
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>X Sword</title>' \
            '<meta http-equiv="refresh" content="0; url=../play/">' \
            '<script>location.replace("../play/" + location.search + location.hash)</script>' > _site/oyun/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
