# main'e her push'ta siteyi GitHub Pages'e yayınlar.
# Kökteki sayfalar (index.html, arena/, engine/ ...) olduğu gibi gider; app/ derlenip /oyun/ altına konur.
# Çalışması için: Settings → Pages → Source: "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Motor testleri
        run: node tests/engine.test.mjs

      - name: Oyunu derle (tip denetimi + Vite)
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Siteyi topla
        run: |
          mkdir _site
          git ls-files -z | grep -zv -e '^app/' -e '^\.' | xargs -0 cp --parents -t _site
          cp -r app/dist _site/oyun

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
